<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#39231f"><meta name="description" content="自分だけの学習博物館 ARCHIVUM">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
<title>ARCHIVUM — Personal Study Museum</title>
</head>
<body>
<header class="top"><button id="menuBtn" class="iconbtn" aria-label="メニュー">☰</button><div><small>PERSONAL STUDY MUSEUM</small><h1>ARCHIVUM</h1></div><span id="cloudState" class="cloud">未接続</span></header>
<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer"><div class="drawerhead"><b>ARCHIVE MENU</b><button id="closeDrawer" class="iconbtn">×</button></div>
<nav class="drawerlinks">
<button data-page="cards">▤ 暗記カード</button><button data-page="quizzes">✎ 確認テスト</button><button data-page="timer">◷ ストップウォッチ</button><button data-page="notes">▧ 教科別メモ</button><button data-page="wrong">⚑ 間違えた問題</button><button data-page="subjects">▦ 教科・単元管理</button>
</nav><div class="drawerfoot"><button id="settingsBtn" class="secondary">クラウド接続設定</button><button id="exportBtn" class="secondary">バックアップを書き出す</button><label class="secondary import">バックアップを読み込む<input id="importFile" type="file" accept="application/json"></label></div></aside>
<main id="app" class="main"></main>
<nav class="bottom">
<button data-page="home" class="active"><span>⌂</span>ホーム</button><button data-page="study"><span>▤</span>学習</button><button data-page="exams"><span>▣</span>試験</button><button data-page="plan"><span>▦</span>計画</button><button data-page="records"><span>▥</span>記録</button>
</nav>
<div id="modalHost"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
</body></html>
